      - Miscellany: my-writings/miscellany/index.md
      - My Poems: my-writings/poems/index.md

extra:
  # Set your own social media below (or remove)
  social:
    # For other social icons at https://squidfunk.github.io/mkdocs-material/setup/adding-social-links/
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/cabofcuriosity
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jesal-mehta-8762404a/

theme:
  name: material
  palette:
    # scheme: slate is the dark baseline; exact hex values come from
    # extra_css below (_assets/backend/css/bookshelf-tokens.css ->
    # _assets/material/css/bookshelf-material.css), which overrides Material's
    # --md-* variables to match the landing page's ink/gold/sepia
    # palette precisely. No light/dark toggle — slate is the only
    # scheme on this site, to match the landing page being dark-only.
    scheme: slate
    primary: custom
    accent: indigo
  font:
    # theme.font.text is a base only — Material applies it to both body
    # and headings, but bookshelf-material.css overrides headings (h1-h3)
    # to Literata separately, so what actually ships is Literata titles /
    # Spectral body. Matches _assets/backend/css/bookshelf-tokens.css's
    # --bookshelf-ff-docs-heading/--bookshelf-ff-docs-body — kept in sync
    # by hand since mkdocs.yml is plain YAML and can't reference a CSS
    # custom property. See DESIGN-SYSTEM.md's "Fonts" section (Bookshelf
    # docs) for the alternatives considered (Spectral solo, Spectral
    # titles/Libre Franklin sans body) and why this pairing won.
    #
    # theme.font.code is intentionally unset: Syne Mono (the landing
    # page's mono face) was previously reused here, but no doc page
    # actually has code blocks — Material just falls back to its own
    # default monospace for the rare inline `code` span.
    text: Spectral
  icon:
    logo: material/lighthouse
  # theme.favicon needs an actual file, unlike theme.icon.logo — it
  # doesn't resolve material/<name> icon slugs, it just outputs the
  # literal string as a broken <link> href. _images/favicon.svg is
  # the bundled mkdocs-material "lighthouse" MDI icon, copied in by hand.
  favicon: _images/favicon.svg
  features:
    # - navigation.tabs
    # - navigation.instant
    - navigation.expand
    # - navigation.sections

markdown_extensions:
  - extra
  - smarty
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - markdown_captions
  - attr_list

plugins:
  - mkdocs-video
  - section-index

extra_css:
  - _assets/backend/css/bookshelf-tokens.css
  - _assets/material/css/bookshelf-material.css
  - _assets/backend/css/bookshelf-landing.css

