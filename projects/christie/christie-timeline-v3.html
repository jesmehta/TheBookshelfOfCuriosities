<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christie Timeline — Bookshelf of Curiosities</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Josefin+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#0a0a07; --panel:#141210; --panel-2:#1a1713;
  --rule: rgba(224,201,138,0.22); --rule-soft: rgba(224,201,138,0.1);
  --ivory:#f0e6cf; --ivory-dim: rgba(240,230,207,0.62); --ivory-faint: rgba(240,230,207,0.36);
  --gold:#c9a227; --gold-bright:#e8c04a; --gold-dim: rgba(201,162,39,0.45);
  --loc-london:#e8c04a; --loc-uk:#2f9169; --loc-europe:#a3314a; --loc-elsewhere:#1f8f95;
  --select-stroke:#fff;
  --frame-outer: var(--gold-dim); --frame-inner: var(--rule-soft);
  --bg-glow-1: rgba(201,162,39,0.07); --bg-glow-2: rgba(31,143,149,0.05);
}
html[data-theme="light"]{
  /* First pass at a light theme — same gold tone used for both frame
     lines front-to-back, no independent contrast swap yet. */
  --ink:#f6efd9; --panel:#fffcf2; --panel-2:#efe1bd;
  --rule: rgba(169,116,10,0.3); --rule-soft: rgba(169,116,10,0.16);
  --ivory:#4a3a10; --ivory-dim: rgba(74,58,16,0.7); --ivory-faint: rgba(74,58,16,0.42);
  --gold:#a9740a; --gold-bright:#c68a0d; --gold-dim: rgba(169,116,10,0.4);
  --loc-london:#c68a0d; --loc-uk:#3f8f63; --loc-europe:#a3314a; --loc-elsewhere:#1f8f95;
  --select-stroke:#4a3a10;
  --frame-outer: var(--gold-dim); --frame-inner: var(--gold-dim);
  --bg-glow-1: rgba(169,116,10,0.08); --bg-glow-2: rgba(31,143,149,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--ivory);font-family:'Cormorant Garamond',serif;}
body{background-image:
    radial-gradient(ellipse at 20% -10%, var(--bg-glow-1), transparent 40%),
    radial-gradient(ellipse at 90% 110%, var(--bg-glow-2), transparent 45%);}
.wrap{max-width:1440px;margin:0 auto;padding:36px 28px 80px;position:relative;}

.deco-frame{position:relative; border:1px solid var(--frame-outer);}
.deco-frame::before{content:""; position:absolute; inset:5px; border:1px solid var(--frame-inner); pointer-events:none;}

.theme-toggle{position:absolute; top:36px; right:28px; font-family:'Josefin Sans', sans-serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-faint); background:transparent; border:1px solid var(--rule); padding:6px 12px; cursor:pointer;}
.theme-toggle:hover{border-color:var(--gold-dim); color:var(--ivory);}

.masthead{position:relative; padding-bottom:16px; margin-bottom:26px; text-align:center;}
.masthead::before{
  content:""; position:absolute; left:50%; top:-20px; width:700px; height:180px; transform:translateX(-50%);
  background: repeating-conic-gradient(from -90deg at 50% 100%, var(--gold-dim) 0deg 3deg, transparent 3deg 11deg);
  -webkit-mask-image: radial-gradient(ellipse 55% 100% at 50% 100%, #000 35%, transparent 78%);
  mask-image: radial-gradient(ellipse 55% 100% at 50% 100%, #000 35%, transparent 78%);
  opacity:0.5; pointer-events:none; z-index:0;
}
.masthead-title, .chevron-rule{position:relative; z-index:1;}
.masthead-title{font-family:'Cinzel Decorative', serif; font-weight:700; font-size:38px; letter-spacing:0.04em; color:var(--ivory); text-transform:uppercase;}
.masthead-sub{position:relative; z-index:1; font-family:'Josefin Sans', sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ivory-dim); margin-top:10px;}
.chevron-rule{height:9px; margin-top:18px; opacity:0.8;
  background-image:
    linear-gradient(135deg, var(--gold-bright) 25%, transparent 25.5%),
    linear-gradient(225deg, var(--gold-bright) 25%, transparent 25.5%);
  background-size: 18px 9px; background-position: 0 0; background-repeat:repeat-x;}

.layout{display:flex; align-items:flex-start; gap:22px;}
.sidebar{flex:0 0 220px; display:flex; flex-direction:column; gap:20px; background:var(--panel); padding:18px 18px 20px; position:sticky; top:20px;}
.content{flex:1 1 auto; min-width:0;}

.filter-label{font-family:'Josefin Sans', sans-serif; font-weight:600; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-dim); display:block; margin-bottom:9px;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{font-family:'Josefin Sans', sans-serif; font-weight:500; font-size:11px; letter-spacing:0.03em; padding:5px 9px; border:1px solid var(--rule); color:var(--ivory-dim); cursor:pointer; background:transparent; user-select:none; transition:border-color .15s, color .15s, background .15s;}
.chip:hover{border-color:var(--gold-dim); color:var(--ivory);}
.chip.on{background:rgba(201,162,39,0.16); border-color:var(--gold); color:var(--gold-bright);}
.filter-clear{font-family:'Josefin Sans', sans-serif; font-size:11px; letter-spacing:0.04em; color:var(--ivory-faint); background:none; border:none; cursor:pointer; text-decoration:underline; text-decoration-color:var(--rule); padding:0; text-align:left;}
.filter-clear:hover{color:var(--gold-bright);}
.result-count{font-family:'Josefin Sans', sans-serif; font-size:11px; letter-spacing:0.04em; color:var(--ivory-faint); border-top:1px solid var(--rule-soft); padding-top:14px;}

.legend-strip{display:flex; flex-wrap:wrap; gap:26px; align-items:center; background:var(--panel); padding:12px 18px; margin-bottom:10px; font-family:'Josefin Sans', sans-serif; font-size:10.5px; color:var(--ivory-faint);}
.legend-title{color:var(--gold-dim); text-transform:uppercase; letter-spacing:0.1em; font-size:9.5px; margin-right:4px;}
.legend-group{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:10px; height:10px; display:inline-block; background:var(--ivory-faint); border:1px solid var(--ink);}
.legend-swatch.tri{background:transparent; width:0; height:0; border-left:5.5px solid transparent; border-right:5.5px solid transparent; border-bottom:9.5px solid var(--ivory-faint);}
.legend-swatch.circ{border-radius:50%;}

.chart-wrap{background:var(--panel); padding:10px 4px 4px; margin-bottom:8px; overflow-x:auto;}
svg#timeline{display:block;}
.life-band{fill:rgba(201,162,39,0.06);}
.lane-band{fill:rgba(240,230,207,0.02);}
.lane-band.alt{fill:rgba(240,230,207,0.045);}
.lane-label{font-family:'Josefin Sans', sans-serif; font-weight:700; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; fill:var(--ivory);}
.life-label{font-family:'Josefin Sans', sans-serif; font-weight:700; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; fill:var(--gold-bright);}
.lane-count{font-family:'Josefin Sans', sans-serif; font-size:9.5px; fill:var(--ivory-faint);}
.life-line{stroke:var(--gold-bright); stroke-width:3; stroke-linecap:round;}
.life-tick{stroke:var(--gold-dim); stroke-width:1;}
.span-bar{stroke:var(--gold-dim); stroke-width:2; stroke-linecap:round; opacity:0.5;}
.connector{stroke:var(--gold-dim); stroke-width:0.8; stroke-dasharray:1.5 3; opacity:0.35; pointer-events:none;}
.grid-line{stroke:var(--rule-soft); stroke-width:1;}
.grid-label{font-family:'Josefin Sans', sans-serif; font-size:10px; fill:var(--ivory-faint);}
.dot-mark{cursor:pointer; stroke:var(--ink); stroke-width:0.8; transition:opacity .15s;}
.dot-mark.dim{opacity:0.15;}
.dot-mark.selected{stroke:var(--select-stroke); stroke-width:1.6;}

.tooltip{position:fixed; z-index:40; pointer-events:none; opacity:0; transition:opacity .1s; max-width:280px; background:var(--ink); border:1px solid var(--gold-dim); padding:10px 12px; font-size:13px; line-height:1.5; font-family:'Cormorant Garamond',serif; box-shadow:0 12px 30px rgba(0,0,0,.5);}
.tooltip b{display:block; font-style:italic; color:var(--gold-bright); margin-bottom:3px; font-size:14.5px;}
.tooltip .tt-meta{font-family:'Josefin Sans', sans-serif; font-size:10.5px; letter-spacing:0.02em; color:var(--ivory-dim);}

table{width:100%; border-collapse:collapse; font-size:14.5px;}
thead th{text-align:left; font-family:'Josefin Sans', sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold-dim); border-bottom:1px solid var(--rule); padding:10px 12px; cursor:pointer; white-space:nowrap;}
thead th:hover{color:var(--gold-bright);}
thead th.sorted::after{content:' ▾'; color:var(--gold-bright);}
tbody tr{border-bottom:1px solid var(--rule-soft); cursor:pointer; transition:background .12s;}
tbody tr:hover{background:rgba(240,230,207,0.03);}
tbody tr.selected{background:rgba(201,162,39,0.09);}
tbody td{padding:10px 12px; vertical-align:top; color:var(--ivory-dim);}
tbody td.title-cell{color:var(--ivory); font-style:italic;}
tbody tr.dim{opacity:0.28;}

@media (max-width:900px){ .layout{flex-direction:column;} .sidebar{flex:1 1 auto; width:100%;} }
</style>
</head>

    </div>
  </div>
</div>

DATA.forEach((d,i)=>{ d.id = i; });

const CHRISTIE_LIFE = { born:1890, died:1976, bornLabel:"15 Sep 1890", diedLabel:"12 Jan 1976" };
const LANES = ["Poirot","Marple","Parker Pyne","Quin & Satterthwaite","Tommy & Tuppence","Standalone","Various"];
const LOC_COLOR = {london:"var(--loc-london)", uk:"var(--loc-uk)", europe:"var(--loc-europe)", elsewhere:"var(--loc-elsewhere)"};
const REGIONS = ["London","UK","Europe & the Orient","South Africa","Caribbean","Global / Unconfirmed"];
const FORMAT_SHAPE = {"Novel":"square","Short story":"triangle","Short story collection":"circle"};

const state = {
  filters:{ protagonist:new Set(), region:new Set(), format:new Set() },
  selectedId:null, sortKey:"yr", sortDir:1
};
const YEAR_BOUNDS = [1920, 1997];

function uniqueProtagonists(){ return [...new Set(DATA.flatMap(d=>d.p))].sort((a,b)=>{
  const ia=LANES.indexOf(a), ib=LANES.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib);
}); }

function matches(d){
  const f = state.filters;
  if(f.protagonist.size && !d.p.some(x=>f.protagonist.has(x))) return false;
  if(f.region.size && !f.region.has(d.region)) return false;
  if(f.format.size && !f.format.has(d.f)) return false;
  return true;
}

function renderFilterBar(){
  const container = document.getElementById("sidebar");
  container.innerHTML = "";
  const groups = [
    {key:"protagonist", label:"Protagonist", opts:uniqueProtagonists()},
    {key:"region", label:"Location", opts:REGIONS.filter(r=>DATA.some(d=>d.region===r))},
    {key:"format", label:"Format", opts:["Novel","Short story","Short story collection"]},
  ];
  groups.forEach(g=>{
    const wrap = document.createElement("div"); wrap.className = "filter-group";
    const lbl = document.createElement("span"); lbl.className = "filter-label"; lbl.textContent = g.label;
    wrap.appendChild(lbl);
    const row = document.createElement("div"); row.className = "chip-row";
    g.opts.forEach(opt=>{
      const chip = document.createElement("button");
      chip.className = "chip" + (state.filters[g.key].has(opt) ? " on" : "");
      chip.textContent = opt;
      chip.onclick = ()=>{
        if(state.filters[g.key].has(opt)) state.filters[g.key].delete(opt);
        else state.filters[g.key].add(opt);
        renderAll();
      };
      row.appendChild(chip);
    });
    wrap.appendChild(row);
    container.appendChild(wrap);
  });
  const clear = document.createElement("button");
  clear.className = "filter-clear"; clear.textContent = "Clear filters";
  clear.onclick = ()=>{ Object.values(state.filters).forEach(s=>s.clear()); renderAll(); };
  container.appendChild(clear);
  const count = document.createElement("div");
  count.className = "result-count";
  count.textContent = DATA.filter(matches).length + " / " + DATA.length + " entries";
  container.appendChild(count);
}

/* =====================================================================
   TIMELINE CHART — Christie's lifetime as the spine, works drop into lanes
   ===================================================================== */
function shapeEl(shape, cx, cy, r, cls){
  const ns = "http://www.w3.org/2000/svg";
  if(shape==="square"){
    const el = document.createElementNS(ns,"rect");
    const s = r*1.8;
    el.setAttribute("x",cx-s/2); el.setAttribute("y",cy-s/2); el.setAttribute("width",s); el.setAttribute("height",s);
    el.setAttribute("class",cls); return el;
  }
  if(shape==="triangle"){
    const el = document.createElementNS(ns,"polygon");
    const s = r*2.3;
    el.setAttribute("points", `${cx},${cy-s*0.62} ${cx-s*0.55},${cy+s*0.42} ${cx+s*0.55},${cy+s*0.42}`);
    el.setAttribute("class",cls); return el;
  }
  const el = document.createElementNS(ns,"circle");
  el.setAttribute("cx",cx); el.setAttribute("cy",cy); el.setAttribute("r",r);
  el.setAttribute("class",cls); return el;
}

// Decluttering the Poirot 1933-38 run: assign a vertical zigzag offset
// (0, +s, -s, +2s, -2s, ...) to points that land within `threshold` px of
// each other along the year axis, in ascending-x order.
function computeJitter(laneAll, xFn){
  const items = [...laneAll].sort((a,b)=> a.yr-b.yr || a.id-b.id);
  const threshold = 15, step = 5;
  const offsets = new Map();
  let cluster = [], lastX = null;
  const flush = ()=>{
    cluster.forEach((d,i)=>{
      const mag = Math.ceil(i/2)*step;
      offsets.set(d.id, i===0 ? 0 : (i%2===1 ? mag : -mag));
    });
    cluster = [];
  };
  items.forEach(d=>{
    const xx = xFn(d.yr);
    if(lastX!==null && xx-lastX >= threshold) flush();
    cluster.push(d); lastX = xx;
  });
  flush();
  return offsets;
}

let tt;
function tip(evt, html){
  if(!tt) tt = document.getElementById("tooltip");
  tt.innerHTML = html;
  tt.style.left = (evt.clientX+14)+"px";
  tt.style.top = (evt.clientY+14)+"px";
  tt.style.opacity = 1;
}
function untip(){ if(tt) tt.style.opacity = 0; }

function renderTimeline(){
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("timeline");
  svg.innerHTML = "";

  const pad = 3;
  const start = Math.min(YEAR_BOUNDS[0], CHRISTIE_LIFE.born) - pad;
  const end = Math.max(YEAR_BOUNDS[1], CHRISTIE_LIFE.died) + pad;

  const left = 168, right = 40, top = 34, lifeRowH = 56, rowH = 56;
  const plotW = Math.max(1000, (end-start)*8);
  const w = left+plotW+right;
  const h = top + lifeRowH + LANES.length*rowH + 24;
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  const x = yr => left + ((yr-start)/(end-start))*plotW;

  // decade gridlines spanning the whole chart height
  let gStart = Math.ceil(start/10)*10;
  for(let yr=gStart; yr<=end; yr+=10){
    const xx = x(yr);
    const line = document.createElementNS(svgNS,"line");
    line.setAttribute("class","grid-line");
    line.setAttribute("x1",xx); line.setAttribute("x2",xx); line.setAttribute("y1",top-6); line.setAttribute("y2",h-10);
    svg.appendChild(line);
    const label = document.createElementNS(svgNS,"text");
    label.setAttribute("class","grid-label"); label.setAttribute("x",xx); label.setAttribute("y",top-12); label.setAttribute("text-anchor","middle");
    label.textContent = yr;
    svg.appendChild(label);
  }

  // ---- Christie's lifetime: the primary spine ----
  const lifeY = top + lifeRowH/2;
  const lifeBand = document.createElementNS(svgNS,"rect");
  lifeBand.setAttribute("class","life-band");
  lifeBand.setAttribute("x",0); lifeBand.setAttribute("y",top); lifeBand.setAttribute("width",w); lifeBand.setAttribute("height",lifeRowH);
  svg.appendChild(lifeBand);

  const lifeLine = document.createElementNS(svgNS,"line");
  lifeLine.setAttribute("class","life-line");
  lifeLine.setAttribute("x1",x(CHRISTIE_LIFE.born)); lifeLine.setAttribute("x2",x(CHRISTIE_LIFE.died));
  lifeLine.setAttribute("y1",lifeY); lifeLine.setAttribute("y2",lifeY);
  lifeLine.onmousemove = (e)=> tip(e, `<b>Agatha Christie</b><span class="tt-meta">${CHRISTIE_LIFE.bornLabel} – ${CHRISTIE_LIFE.diedLabel}</span>`);
  lifeLine.onmouseleave = untip;
  svg.appendChild(lifeLine);
  [CHRISTIE_LIFE.born, CHRISTIE_LIFE.died].forEach(yr=>{
    const tick = document.createElementNS(svgNS,"line");
    tick.setAttribute("class","life-tick");
    tick.setAttribute("x1",x(yr)); tick.setAttribute("x2",x(yr)); tick.setAttribute("y1",lifeY-9); tick.setAttribute("y2",lifeY+9);
    svg.appendChild(tick);
  });
  const lifeLabel = document.createElementNS(svgNS,"text");
  lifeLabel.setAttribute("class","life-label"); lifeLabel.setAttribute("x",10); lifeLabel.setAttribute("y",lifeY-8);
  lifeLabel.textContent = "Agatha Christie";
  svg.appendChild(lifeLabel);
  const lifeSub = document.createElementNS(svgNS,"text");
  lifeSub.setAttribute("class","lane-count"); lifeSub.setAttribute("x",10); lifeSub.setAttribute("y",lifeY+10);
  lifeSub.textContent = `${CHRISTIE_LIFE.bornLabel} – ${CHRISTIE_LIFE.diedLabel}`;
  svg.appendChild(lifeSub);

  // per-lane jitter maps, shared between the connector pass and the dot pass
  const jitterByLane = new Map();
  LANES.forEach(lane=>{
    jitterByLane.set(lane, computeJitter(DATA.filter(d=>d.p.includes(lane)), x));
  });

  // ---- connector threads from the spine down into each lane ----
  LANES.forEach((lane, idx)=>{
    const baseY = top + lifeRowH + idx*rowH + rowH/2;
    const jitter = jitterByLane.get(lane);
    DATA.filter(d=>d.p.includes(lane)).forEach(d=>{
      const xx = x(d.yr);
      const dy = baseY + (jitter.get(d.id)||0);
      const conn = document.createElementNS(svgNS,"line");
      conn.setAttribute("class","connector"+(matches(d)?"":" dim"));
      conn.setAttribute("x1",xx); conn.setAttribute("x2",xx);
      conn.setAttribute("y1",lifeY+9); conn.setAttribute("y2",dy-14);
      if(!matches(d)) conn.style.opacity = 0.08;
      svg.appendChild(conn);
    });
  });

  // ---- protagonist lanes ----
  LANES.forEach((lane, idx)=>{
    const baseY = top + lifeRowH + idx*rowH + rowH/2;
    const jitter = jitterByLane.get(lane);
    const laneAll = DATA.filter(d=>d.p.includes(lane));
    const laneVisible = laneAll.filter(matches);

    const band = document.createElementNS(svgNS,"rect");
    band.setAttribute("class","lane-band"+(idx%2?" alt":""));
    band.setAttribute("x",0); band.setAttribute("y", top+lifeRowH+idx*rowH); band.setAttribute("width", w); band.setAttribute("height", rowH);
    svg.appendChild(band);

    if(laneAll.length){
      const years = laneAll.map(d=>d.yr);
      const spanBar = document.createElementNS(svgNS,"line");
      spanBar.setAttribute("class","span-bar");
      spanBar.setAttribute("x1", x(Math.min(...years))); spanBar.setAttribute("x2", x(Math.max(...years)));
      spanBar.setAttribute("y1", baseY); spanBar.setAttribute("y2", baseY);
      svg.appendChild(spanBar);
    }

    const laneLabel = document.createElementNS(svgNS,"text");
    laneLabel.setAttribute("class","lane-label"); laneLabel.setAttribute("x",10); laneLabel.setAttribute("y",baseY-4);
    laneLabel.textContent = lane;
    svg.appendChild(laneLabel);
    const laneCount = document.createElementNS(svgNS,"text");
    laneCount.setAttribute("class","lane-count"); laneCount.setAttribute("x",10); laneCount.setAttribute("y",baseY+11);
    laneCount.textContent = `${laneVisible.length}/${laneAll.length} shown`;
    svg.appendChild(laneCount);

    laneAll.forEach(d=>{
      const xx = x(d.yr);
      const dy = baseY + (jitter.get(d.id)||0);
      const shape = FORMAT_SHAPE[d.f] || "circle";
      const dim = !matches(d);
      const g = shapeEl(shape, xx, dy, 6, "dot-mark"+(dim?" dim":"")+(d.id===state.selectedId?" selected":""));
      g.style.fill = LOC_COLOR[d.panel];
      g.onmousemove = (e)=> tip(e, `<b>${d.t.replace(/^"|"$/g,"")}</b><span class="tt-meta">${d.p.join(", ")} · ${d.f} · ${d.yr}<br>${d.region}<br>${d.loc}</span>`);
      g.onmouseleave = untip;
      g.onclick = ()=> selectBook(d.id);
      svg.appendChild(g);
    });
  });
}

function selectBook(id){
  state.selectedId = id;
  renderTimeline(); renderTable();
  const row = document.querySelector(`#tl-tbody tr[data-id="${id}"]`);
  if(row) row.scrollIntoView({behavior:"smooth", block:"center"});
}

/* =====================================================================
   TABLE
   ===================================================================== */
const COLS = [
  {key:"title", get:d=>d.t}, {key:"protagonist", get:d=>d.p.join(", ")}, {key:"type", get:d=>d.ty},
  {key:"format", get:d=>d.f}, {key:"year", get:d=>d.yr}, {key:"region", get:d=>d.region},
  {key:"loc", get:d=>d.loc}, {key:"time", get:d=>d.time}, {key:"realWorld", get:d=>d.rw},
];
function renderTable(){
  const thead = document.querySelector("#tl-table thead tr");
  thead.querySelectorAll("th").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.key === state.sortKey);
    th.onclick = ()=>{
      if(state.sortKey === th.dataset.key) state.sortDir *= -1;
      else { state.sortKey = th.dataset.key; state.sortDir = 1; }
      renderTable();
    };
  });
  const rows = [...DATA];
  const col = COLS.find(c=>c.key===state.sortKey) || COLS[4];
  rows.sort((a,b)=>{
    const va=col.get(a), vb=col.get(b);
    if(typeof va==="number") return (va-vb)*state.sortDir;
    return String(va).localeCompare(String(vb))*state.sortDir;
  });
  const tbody = document.getElementById("tl-tbody");
  tbody.innerHTML = "";
  rows.forEach(d=>{
    const tr = document.createElement("tr");
    tr.className = (matches(d)?"":"dim") + (d.id===state.selectedId?" selected":"");
    tr.dataset.id = d.id;
    tr.innerHTML = `
      <td class="title-cell">${d.t}</td>
      <td>${d.p.join(", ")}</td><td>${d.ty}</td><td>${d.f}</td><td>${d.yr}</td>
      <td>${d.region}</td><td>${d.loc}</td><td>${d.time}</td><td>${d.rw}</td>
    `;
    tr.onclick = ()=> selectBook(d.id);
    tbody.appendChild(tr);
  });
}

/* =====================================================================
   THEME TOGGLE (dark lacquer ⇄ cream paper, both same Deco palette)
   ===================================================================== */
(function initTheme(){
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  const apply = (theme)=>{
    if(theme==="light") root.setAttribute("data-theme","light");
    else root.removeAttribute("data-theme");
    btn.textContent = theme==="light" ? "Dark" : "Light";
  };
  let saved = "dark";
  try{ saved = localStorage.getItem("christie-timeline-theme") || "dark"; }catch(e){}
  apply(saved);
  btn.onclick = ()=>{
    const next = root.getAttribute("data-theme")==="light" ? "dark" : "light";
    apply(next);
    try{ localStorage.setItem("christie-timeline-theme", next); }catch(e){}
  };
})();

/* =====================================================================
   INIT + CONTROLS
   ===================================================================== */
function renderAll(){
  renderFilterBar();
  renderLegend();
  renderTimeline();
  renderTable();
}
renderAll();
